apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies
spec:
  selector:
    matchLabels:
      app: movies
  replicas: 1
  template:
    metadata:
      labels:
        app: movies
    spec:
      containers:
        - name: movies
          image: movies
          envFrom:
            - secretRef:
                name: solanumstreaming-env
          ports:
            - containerPort: 8082
