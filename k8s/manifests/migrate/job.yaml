apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate
          envFrom:
            - secretRef:
                name: solanumstreaming-env
          command: ["sh", "-c"]
          args:
            - |
              set -e
              DB_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
              migrate -path /migrations/auth -database "${DB_URL}&x-migrations-table=internal.auth_schema_migrations" up
              migrate -path /migrations/movies -database "${DB_URL}&x-migrations-table=internal.movies_schema_migrations" up
