apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solanumstreaming

resources:
  - ingress.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - auth/deployment.yaml
  - auth/service.yaml
  - movies/deployment.yaml
  - movies/service.yaml
  - stream/deployment.yaml
  - stream/service.yaml
  - stream/service-torrent.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - jackett/deployment.yaml
  - jackett/pvc.yaml
  - jackett/service.yaml
  - migrate/job.yaml

images:
  - name: frontend
    newName: ghcr.io/anicet78/solanumstreaming-frontend
    newTag: latest
  - name: auth
    newName: ghcr.io/anicet78/solanumstreaming-auth
    newTag: latest
  - name: movies
    newName: ghcr.io/anicet78/solanumstreaming-movies
    newTag: latest
  - name: stream
    newName: ghcr.io/anicet78/solanumstreaming-stream
    newTag: latest
  - name: migrate
    newName: ghcr.io/anicet78/solanumstreaming-migrate
    newTag: latest

configMapGenerator:
  - name: postgres-init
    files:
      - postgres/init.sh
