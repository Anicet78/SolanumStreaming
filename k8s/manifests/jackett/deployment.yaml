apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      containers:
        - name: jackett
          image: docker.io/linuxserver/jackett:latest
          env:
            - name: TZ
              value: Europe/Paris
            - name: AUTO_UPDATE
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 9117
          volumeMounts:
            - name: config
              mountPath: /config/Jackett
      volumes:
        - name: config
          hostPath:
            path: /home/ubuntu/SolanumStreaming/jackett
            type: Directory
