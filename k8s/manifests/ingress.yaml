apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solanumstreaming
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [solanumstreaming.domain.com]
      secretName: solanumstreaming-tls
  rules:
    - host: solanumstreaming.domain.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8081
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: movies
                port:
                  number: 8082
          - path: /api/stream
            pathType: Prefix
            backend:
              service:
                name: stream
                port:
                  number: 8083
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                ports:
                  number: 80
