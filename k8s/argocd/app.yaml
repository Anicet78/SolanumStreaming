apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app
  namespace: solanumstreaming
spec:
  destination:
    namespace: solanumstreaming
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/Anicet78/SolanumStreaming
    targetRevision: main
    path: k8s/manifests
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
