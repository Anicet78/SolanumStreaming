services:
  postgres:
    image: docker.io/postgres:18.3
    container_name: postgres-c
    ports:
      - 5432:5432
    networks:
      - solanum-streaming
    env_file:
      - .env
    volumes:
      - postgres-v:/var/lib/postgresql
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: docker.io/migrate/migrate
    container_name: migrate-c
    networks:
      - solanum-streaming
    env_file:
      - .env
    volumes:
      - ./services/auth/migrations:/migrations/auth
      - ./services/movies/migrations:/migrations/movies
    entrypoint:
      - sh
      - -c
      - |
        set -e
        DB_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
        migrate -path /migrations/auth   -database "$${DB_URL}&x-migrations-table=internal.auth_schema_migrations" up &&
        migrate -path /migrations/movies -database "$${DB_URL}&x-migrations-table=internal.movies_schema_migrations" up
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy

  jackett:
    image: docker.io/linuxserver/jackett
    container_name: jackett-c
    ports:
      - 9117:9117
    networks:
      - solanum-streaming
    environment:
      - TZ=Europe/Paris
      - AUTO_UPDATE=true
    userns_mode: keep-id
    volumes:
      - ./jackett:/config/Jackett
    restart: on-failure:3

  # frontend:
  #   build: ./frontend
  #   container_name: frontend-c
  #   ports:
  #     - 8080:8080
  #   restart: on-failure:3

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    container_name: auth-c
    ports:
      - 8081:8081
    networks:
      - solanum-streaming
    env_file:
      - .env
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  movies:
    build:
      context: ./services
      dockerfile: movies/Dockerfile
    container_name: movies-c
    ports:
      - 8082:8082
    networks:
      - solanum-streaming
    env_file:
      - .env
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jackett:
        condition: service_started

  stream:
    build:
      context: ./services
      dockerfile: stream/Dockerfile
    container_name: stream-c
    ports:
      - 8083:8083
      - 6881:6881
      - 6881:6881/udp
    networks:
      - solanum-streaming
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-v:

networks:
  solanum-streaming:
    driver: bridge
