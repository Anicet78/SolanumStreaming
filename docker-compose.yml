services:
  postgres:
    image: docker.io/postgres:18.3
    container_name: postgres-c
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres-v:/var/lib/postgresql
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: docker.io/migrate/migrate
    container_name: migrate-c
    env_file:
      - .env
    volumes:
      - ./services/auth/migrations:/migrations/auth
      - ./services/movies/migrations:/migrations/movies
    entrypoint:
      - sh
      - -c
      - |
        DB_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
        migrate -path /migrations/auth   -database "$${DB_URL}&x-migrations-table=internal.auth_schema_migrations" up &&
        migrate -path /migrations/movies -database "$${DB_URL}&x-migrations-table=internal.movies_schema_migrations" up
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   container_name: frontend-c
  #   ports:
  #     - 8080:8080
  #   restart: on-failure:3

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    container_name: auth-c
    ports:
      - 8081:8081
    env_file:
      - .env
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  movies:
    build:
      context: ./services
      dockerfile: movies/Dockerfile
    container_name: movies-c
    ports:
      - 8082:8082
    env_file:
      - .env
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # stream:
  #   build: ./services/stream
  #   container_name: stream-c
  #   ports:
  #     - 8083:8083
  #   restart: on-failure:3
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     migrate:
  #       condition: service_completed_successfully

volumes:
  postgres-v:
