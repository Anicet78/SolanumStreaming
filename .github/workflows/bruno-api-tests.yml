name: Bruno API Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bruno-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Create .env
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}" >> .env

      - name: Start services
        run: docker compose up -d --build

      - name: Debug ports
        run: |
          docker ps -a
          docker inspect auth-c --format '{{json .NetworkSettings.Ports}}'
          curl -v http://localhost:8081/health || true
          curl -v http://localhost:8082/health || true

      - name: Wait for APIs
        run: npx wait-on --timeout 120000 http://localhost:8081/health http://localhost:8082/health

      - name: Run Bruno demo collection
        working-directory: bruno
        run: |
          bru run \
            --global-env ci \
            --env-var platform_name="GitHub Actions" \
            --env-var build_id="${{ github.run_id }}" \
            --env-var commit_sha="${{ github.sha }}" \
            --reporter-html reports/report.html

      - name: Upload Bruno report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bruno-report
          path: reports/report.html
          if-no-files-found: error
