name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['k8s/**']
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: 'frontend/**'
            auth: ['services/auth/**', 'services/shared/**']
            movies: ['services/movies/**', 'services/shared/**']
            stream: ['services/stream/**', 'services/shared/**']
            migrate: 'services/*/migrations/**'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve context and Dockerfile
        id: cfg
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "context=frontend"  >> $GITHUB_OUTPUT
                      echo "file=frontend/Dockerfile" >> $GITHUB_OUTPUT ;;
            migrate)  echo "context=services"  >> $GITHUB_OUTPUT
                      echo "file=services/migrate.Dockerfile" >> $GITHUB_OUTPUT ;;
            *)        echo "context=services"  >> $GITHUB_OUTPUT
                      echo "file=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.file }}
          push: true
          platforms: linux/arm64
          tags: ghcr.io/anicet78/solanumstreaming-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VITE_AUTH_URL=${{ vars.VITE_AUTH_URL }}
            VITE_MOVIES_URL=${{ vars.VITE_MOVIES_URL }}
            VITE_STREAM_URL=${{ vars.VITE_STREAM_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: deploy-bump
    steps:
      - uses: actions/checkout@v4
      - name: Bump tags
        run: |
          cd k8s/manifests
          for svc in $(echo '${{ needs.changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image $svc=ghcr.io/anicet78/solanumstreaming-$svc:${{ github.sha }}
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${{ github.sha }}"
          git pull --rebase
          git push
